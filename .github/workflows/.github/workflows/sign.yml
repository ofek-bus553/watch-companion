name: Sign tested update
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/sign.yml']
permissions:
  contents: write
jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Sign APKs with original key
        env:
          KEY_B64: ${{ secrets.WATCH_KEYSTORE_B64 }}
          SIGN_PASS: ${{ secrets.WATCH_SIGN_PASSWORD }}
        run: |
          set -e
          base64 -d source-1.1.b64 > source-1.1.zip
          unzip -o source-1.1.zip
          curl -L -s https://services.gradle.org/distributions/gradle-8.11.1-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.11.1/bin/gradle assembleRelease
          cp app/build/outputs/apk/phone/release/app-phone-release-unsigned.apk phone-unsigned.apk
          cp app/build/outputs/apk/watch/release/app-watch-release-unsigned.apk wear-unsigned.apk
          umask 077
          printf '%s' "$KEY_B64" | base64 -d > "$RUNNER_TEMP/signing.jks"
          BT=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1 | xargs dirname)
          mkdir signed
          for d in phone wear; do
            "$BT/zipalign" -f 4 "$d-unsigned.apk" "$RUNNER_TEMP/$d.apk"
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/signing.jks" --ks-pass env:SIGN_PASS --out "signed/$d-1.1.apk" "$RUNNER_TEMP/$d.apk"
            "$BT/apksigner" verify --print-certs "signed/$d-1.1.apk"
          done
          rm "$RUNNER_TEMP/signing.jks"
      - name: Publish first update beta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.1-beta signed/*.apk source-1.1.zip --prerelease --title 'השעון שלי · 1.1 תובנות מקומיות' --notes 'תובנות מקומיות לפי כללים, לא מודל AI. בלי העלאת בריאות. לפחות 3 ימי נתונים; ימים חסרים לא נספרים כאפס. אותה חתימה וחבילה, מתקין כעדכון. לא נבדק על מכשיר פיזי.'
